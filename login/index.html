<!doctype html>
<html lang="zh-CN">
<head>
  <script src="/ui/appearance.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>登录 gitpolar</title>
  <link rel="icon" type="image/png" href="/assets/gitpolar-logo.png">
  <link rel="stylesheet" href="/login/styles.css">
  <script type="module" src="/login/app.js"></script>
  <link rel="stylesheet" href="/ui/motion.css">
  <link rel="stylesheet" href="/ui/github.css">
  <script type="module" src="/ui/shell.js"></script>
</head>
<body data-ui-page="login">
  <main class="login-page" aria-label="登录 gitpolar">
    <div class="login-panel">
      <div class="login-card">
        <button id="login" type="button" disabled>
          <img src="/login/feishu-mark.png" width="22" height="22" alt="">使用飞书登录
        </button>
        <section id="scan" aria-labelledby="scan-title" hidden>
          <h1 id="scan-title" tabindex="-1">用飞书扫码登录</h1>
          <p>用手机飞书扫一扫，选择已开通应用的身份。确认后，这个页面会自动进入你的工作台。</p>
          <img id="qr" width="224" height="224" alt="本次飞书官方授权二维码">
          <div class="scan-actions">
            <button id="open-official" type="button">在本机打开飞书授权页</button>
            <button id="cancel" type="button">取消</button>
          </div>
        </section>
        <p id="error" role="alert" hidden></p>
        <noscript><p>请启用 JavaScript 后使用飞书登录。</p></noscript>
      </div>
    </div>
  </main>
</body>
</html>
