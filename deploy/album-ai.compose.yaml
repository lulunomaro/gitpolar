services:
  gitpolar:
    environment:
      GITPOLAR_IMMICH_URL: http://album-ml:3003
  album-ml:
    # Official multi-architecture CPU image, Immich v3.4.2.
    image: ghcr.io/immich-app/immich-machine-learning@sha256:739405742a79bd7447227c553bb62ed5491aa36acf00bc667af7f9c93b6fae91
    restart: unless-stopped
    environment:
      MACHINE_LEARNING_MODEL_INTRA_OP_THREADS: 3
      MACHINE_LEARNING_MODEL_INTER_OP_THREADS: 1
      MACHINE_LEARNING_REQUEST_THREADS: 3
      OMP_NUM_THREADS: 2
      RAYON_NUM_THREADS: 2
    volumes:
      - album-ml-cache:/cache
volumes:
  album-ml-cache:
