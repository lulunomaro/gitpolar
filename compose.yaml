name: gitpolar
services:
  gitpolar:
    build: .
    image: gitpolar:local
    restart: unless-stopped
    user: "${GITPOLAR_UID:-1000}:${GITPOLAR_GID:-1000}"
    ports:
      - "${BIND_IP:-0.0.0.0}:${PORT:-4317}:4317"
    environment:
      HOST: 0.0.0.0
      PORT: 4317
      APP_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:4317}
      DATA_DIR: /data
      WORKSPACE_NAME: ${WORKSPACE_NAME:-polar-lab}
      PREVIEW_MAX_BYTES: ${PREVIEW_MAX_BYTES:-134217728}
      LFS_MAX_BYTES: ${LFS_MAX_BYTES:-21474836480}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_ALLOWED_TENANTS: ${FEISHU_ALLOWED_TENANTS:-}
      FEISHU_ALLOWED_OPEN_IDS: ${FEISHU_ALLOWED_OPEN_IDS:-}
      FEISHU_ADMIN_OPEN_IDS: ${FEISHU_ADMIN_OPEN_IDS:-}
      FEISHU_WAREHOUSE_BASE_TOKEN: ${FEISHU_WAREHOUSE_BASE_TOKEN:-}
      FEISHU_WAREHOUSE_TABLE_ID: ${FEISHU_WAREHOUSE_TABLE_ID:-}
      FEISHU_WAREHOUSE_FIELDS: ${FEISHU_WAREHOUSE_FIELDS:-}
      FEISHU_INVENTORY_TABLE_ID: ${FEISHU_INVENTORY_TABLE_ID:-}
      FEISHU_INVENTORY_FIELDS: ${FEISHU_INVENTORY_FIELDS:-}
      FEISHU_WAREHOUSE_AUTO_SYNC: ${FEISHU_WAREHOUSE_AUTO_SYNC:-false}
    volumes:
      - type: bind
        source: ${NAS_DATA_DIR:-./data}
        target: /data
    stop_grace_period: 30s
