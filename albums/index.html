<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#e7e7eb" />
    <title>相册工作区 · Gitpolar</title>
    <link rel="icon" href="/assets/gitpolar-logo.png" />
    <link rel="stylesheet" href="/albums/styles.css" />
    <script type="module" src="/albums/app.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">跳到照片区</a>
    <header class="chrome">
      <div class="library-head">
        <button
          class="tool"
          id="toggle-library"
          aria-label="活动目录"
          title="显示或隐藏活动目录"
          aria-controls="library"
        >
          <i data-icon="sidebar"></i></button
        ><a href="/albums/" class="library-name" title="切换相册仓库"
          ><img src="/assets/gitpolar-logo.png" alt="Gitpolar" width="21" height="21" /><strong
            id="library-name"
            >相册资源库</strong
          ><i data-icon="chevrons"></i
        ></a>
      </div>
      <div class="top-middle">
        <div class="tab"><i data-icon="image"></i><span id="tab-title">照片工作区</span></div>
        <label class="search"
          ><i data-icon="search"></i
          ><input
            id="search"
            type="search"
            aria-label="搜索当前视图"
            placeholder="搜索照片、活动或标签"
            maxlength="250"
          /><kbd>/</kbd></label
        >
      </div>
      <button
        id="toggle-info"
        class="tool"
        aria-label="照片检查器"
        title="显示或隐藏检查器"
        aria-controls="inspector"
      >
        <i data-icon="inspector"></i>
      </button>
    </header>
    <div id="shell" class="shell">
      <aside id="library" class="pane library" aria-label="资源库导航">
        <div class="library-scroll">
          <div class="side-label">资源库</div>
          <nav id="views" aria-label="资源库视图"></nav>
          <div id="folders" hidden>
            <div class="side-label"><span>活动目录</span><span id="activity-count"></span></div>
            <nav id="tree" aria-label="按年份浏览活动"></nav>
          </div>
          <div id="collab" hidden>
            <div class="side-label">协作</div>
            <nav id="review-nav" aria-label="相册投稿"></nav>
          </div>
        </div>
        <a id="repo-link" class="repo-foot" href="/#/repos"
          ><i data-icon="branch"></i><span id="ref-label">Gitpolar</span><i data-icon="external"></i
        ></a>
      </aside>
      <main id="main" class="pane center" tabindex="-1">
        <div class="toolbar">
          <div class="heading">
            <span class="heading-icon" id="heading-icon"></span>
            <h1 id="heading">相册工作区</h1>
            <span class="pill" id="total" hidden></span>
          </div>
          <div id="activity-star" hidden></div>
          <div class="toolbar-actions" id="layout-tools" hidden>
            <button class="tool" id="justified" aria-label="等高排列" title="等高排列">
              <i data-icon="rows"></i></button
            ><button class="tool" id="masonry" aria-label="瀑布流" title="瀑布流">
              <i data-icon="masonry"></i></button
            ><label class="zoom" title="缩略图大小"
              ><input type="range" id="size" min="110" max="270" step="10" value="190" aria-label="缩略图大小"
            /></label>
          </div>
          <button class="tool" id="reload-pulls" aria-label="刷新投稿" title="刷新投稿" hidden>
            <i data-icon="refresh"></i>
          </button>
          <button class="primary compact" id="upload" hidden>
            <i data-icon="upload"></i><span>投稿</span>
          </button>
        </div>
        <nav class="star-tabs" id="star-tabs" aria-label="收藏类型" hidden>
          <a href="#/stars" id="stars-photos">照片</a
          ><a href="#/stars/activities" id="stars-activities">活动合集</a>
        </nav>
        <div class="filterbar" id="filters" hidden>
          <label class="filter"
            ><i data-icon="calendar"></i
            ><select id="year" aria-label="年份"></select
          ></label>
          <label class="filter photo-filter"
            ><i data-icon="tag"></i
            ><select id="tag" aria-label="标签"></select
          ></label>
          <label class="filter photo-filter"
            ><i data-icon="star"></i
            ><select id="rating" aria-label="评分">
              <option value="">评分</option>
              <option value="5">5 星</option>
              <option value="4">≥ 4 星</option>
              <option value="3">≥ 3 星</option>
              <option value="1">已打星</option>
              <option value="0">未打星</option>
            </select></label
          >
          <label class="filter sort"
            ><i data-icon="sort"></i
            ><select id="sort" aria-label="排序">
              <option value="desc">日期 ↓</option>
              <option value="asc">日期 ↑</option>
              <option value="name">名称 A–Z</option>
            </select></label
          >
          <button class="filter" id="reset" hidden>清除筛选</button>
          <div class="spacer"></div>
          <button
            class="filter photo-filter"
            id="multi"
            aria-pressed="false"
            title="单击切换每张照片的选择状态"
          >
            <i data-icon="select"></i>多选</button
          ><button
            class="filter photo-filter"
            id="selection-menu"
            popovertarget="select-pop"
            aria-label="选择操作"
          >
            <i data-icon="more"></i>
          </button>
          <div id="select-pop" class="popover" popover>
            <button id="select-all">全选当前结果</button><button id="invert">反选</button
            ><button id="clear-selection">取消选择</button>
          </div>
        </div>
        <div class="scroll" id="scroll">
          <section class="notice" id="notice" role="status">正在读取资源库…</section>
          <div id="gallery"></div>
          <button id="more" class="secondary more" hidden>显示更多</button>
        </div>
        <footer class="statusbar">
          <span id="status" aria-live="polite"></span><span id="status-extra"></span>
        </footer>
      </main>
      <aside id="inspector" class="pane inspector" aria-label="照片检查器">
        <div class="ins-head">
          <span>检查器</span
          ><button id="hide-info" class="tool" aria-label="收起检查器"><i data-icon="inspector"></i></button>
        </div>
        <div id="details"></div>
      </aside>
      <button id="shade" aria-label="收起面板" hidden></button>
    </div>
    <dialog id="viewer" class="lightbox" aria-labelledby="viewer-name">
      <header>
        <strong id="viewer-name"></strong
        ><button class="tool" data-dismiss aria-label="关闭大图"><i data-icon="close"></i></button>
      </header>
      <div class="stage">
        <button class="tool" id="prev" aria-label="上一张"><i data-icon="left"></i></button>
        <div id="stage"></div>
        <button class="tool" id="next" aria-label="下一张"><i data-icon="right"></i></button>
      </div>
      <footer>
        <span id="viewer-meta"></span>
        <div id="viewer-star"></div>
        <span id="position"></span
        ><a id="original" class="secondary" download><i data-icon="download"></i>原图</a>
      </footer>
    </dialog>
    <dialog id="compose" class="dialog" aria-labelledby="compose-title">
      <form id="proposal-form">
        <header>
          <div class="dialog-title">
            <i data-icon="pull"></i>
            <h2 id="compose-title">新建投稿</h2>
          </div>
          <button type="button" class="tool" data-dismiss aria-label="关闭投稿">
            <i data-icon="close"></i>
          </button>
        </header>
        <div class="dialog-body">
          <div id="upload-fields">
            <label>投稿到活动<select id="target-activity" required></select></label>
            <div class="two" id="new-fields" hidden>
              <label>活动名称<input id="activity-name" maxlength="80" /></label
              ><label>活动日期<input id="activity-date" type="date" /></label>
            </div>
            <label class="drop" id="drop"
              ><i data-icon="upload"></i><strong>拖入照片，或点击选择</strong
              ><small>JPEG、PNG、WebP、GIF · 每张最多 64 MiB</small
              ><input id="file-input" type="file" accept=".jpg,.jpeg,.png,.webp,.gif" multiple
            /></label>
            <div class="queue" id="queue"></div>
          </div>
          <div id="edit-summary" class="callout" hidden></div>
          <label
            >投稿标题<input
              id="pr-title"
              required
              maxlength="120"
              placeholder="例如：补充周六训练合照" /></label
          ><label
            >说明 <small>可选</small><textarea id="pr-description" maxlength="3000" rows="2"></textarea>
          </label>
          <p class="feedback" id="compose-status" role="status"></p>
        </div>
        <footer><span>合并后在主相册可见</span><button class="primary" id="submit-pr">提交 PR</button></footer>
      </form>
    </dialog>
    <dialog id="review" class="dialog review" aria-labelledby="review-title">
      <header>
        <div class="dialog-title">
          <i data-icon="pull"></i>
          <h2 id="review-title">相册投稿</h2>
        </div>
        <button class="tool" data-dismiss aria-label="关闭审核详情"><i data-icon="close"></i></button>
      </header>
      <div class="dialog-body" id="review-content"></div>
    </dialog>
  </body>
</html>
