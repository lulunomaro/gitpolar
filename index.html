<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <script src="/ui/appearance.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#465069">
  <meta name="color-scheme" content="light dark">
  <meta name="application-name" content="gitpolar">
  <link rel="icon" type="image/png" href="./assets/favicon.png">
  <link rel="stylesheet" href="./styles.css">
  <script src="./demo.js" defer></script>
  <script src="./live.js" defer></script>
  <script src="./viewer.js" defer></script>
  <script src="/ui/collaboration.js" defer></script>
  <script src="/ui/github-app.js" defer></script>
  <script src="./app.js" defer></script>
  <title>gitpolar</title>
  <link rel="stylesheet" href="/ui/motion.css">
  <link rel="stylesheet" href="/ui/github.css">
  <link rel="stylesheet" href="/ui/collaboration.css">
  <script type="module" src="/ui/shell.js"></script>
</head>
<body data-ui-page="root">
  <a class="skip-link" href="#view">跳到正文</a>
  <aside class="workspace-rail" aria-label="工作区">
    <a class="rail-brand" href="#/" aria-label="gitpolar 工作台"><img src="./assets/gitpolar-logo.png" width="32" height="32" alt=""><strong>gitpolar</strong></a>
    <button class="rail-search" type="button" data-action="search" aria-label="搜索工作区"><span data-icon="search"></span>搜索<kbd>/</kbd></button>
    <nav class="workspace-nav" aria-label="工作区导航"></nav>
    <div class="rail-tools">
      <button type="button" data-action="notifications"><span data-icon="inbox"></span>通知</button>
      <button type="button" data-action="account"><span data-icon="person"></span>我的账户</button>
    </div>
  </aside>
  <div class="workspace-frame">
  <header class="site-header">
    <div class="topbar">
      <div class="top-context">
        <button type="button" class="button icon-button subtle" id="menu-toggle" aria-label="Open navigation menu" aria-expanded="false" aria-controls="navigation"><span data-icon="three-bars"></span></button>
        <a class="brand" href="#/" aria-label="gitpolar home"><img class="site-logo" src="./assets/gitpolar-logo.png" width="32" height="32" alt=""><span class="brand-name">gitpolar</span></a>
        <nav class="crumb" id="crumb" aria-label="Breadcrumb"></nav>
      </div>
      <div class="top-actions">
        <button type="button" class="search-button" data-action="search" aria-label="Search or jump to" aria-keyshortcuts="Control+K Meta+K">
          <span data-icon="search"></span><span class="search-label">Type <kbd>/</kbd> to search</span><span class="search-shortcut" aria-hidden="true">⌕</span>
        </button>
        <span class="header-divider"></span>
        <button type="button" class="button icon-button subtle copilot-button" data-action="copilot" title="Copilot" aria-label="Copilot"><span data-icon="copilot"></span></button>
        <button type="button" class="button create-trigger subtle" data-action="new-repo" title="Create new" aria-label="Create new repository"><span data-icon="plus"></span><span data-icon="chevron-down" data-size="12"></span></button>
        <a class="button icon-button subtle global-shortcut" href="#/issues" title="Issues" aria-label="Your issues"><span data-icon="issue-opened"></span></a>
        <a class="button icon-button subtle global-shortcut" href="#/pulls" title="Pull requests" aria-label="Your pull requests"><span data-icon="git-pull-request"></span></a>
        <button type="button" class="button icon-button subtle" data-action="notifications" title="Notifications" aria-label="Notifications"><span data-icon="inbox"></span><span class="notification-dot"></span></button>
        <div id="account"><button type="button" class="account-trigger" data-action="account" aria-label="Open user menu"><span id="account-avatar"></span></button></div>
      </div>
    </div>
    <nav class="tabs" id="top-nav" aria-label="Repository navigation" hidden></nav>
  </header>
  <main class="view" id="view" tabindex="-1"><noscript>请启用 JavaScript 以打开工作区。</noscript></main>
  </div>
  <dialog class="drawer" id="navigation" aria-labelledby="navigation-title">
    <div class="drawer-head"><a class="brand" href="#/" aria-label="gitpolar home"><img class="site-logo" src="./assets/gitpolar-logo.png" width="32" height="32" alt=""><span class="brand-name">gitpolar</span></a><span id="navigation-title" class="sr-only">Navigation menu</span><button type="button" class="button icon-button ghost" id="menu-close" aria-label="Close navigation menu" autofocus><span data-icon="x"></span></button></div>
    <nav class="drawer-nav" aria-label="Global navigation"></nav>
    <div class="drawer-section"><div class="section-head"><h2>Repositories</h2><a href="#/repos" class="icon-link" aria-label="All repositories"><span data-icon="chevron-right"></span></a></div><div id="pinned-nav"></div></div>
    <div class="drawer-footer">© 2026 gitpolar<span class="local-badge">Local preview</span></div>
  </dialog>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
